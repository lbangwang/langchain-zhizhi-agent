# 应用 + MySQL + Redis。阿里云：docs/deploy-aliyun.md
# 给 mysql/redis 固定内网 IP，并写入 app 的 extra_hosts。
# 部分 ECS 上 Docker 内置 DNS 失效（解析不了服务名 mysql），用 /etc/hosts 绕过。

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: zhizhi-mysql
    hostname: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhizhi_ai_agent}
    volumes:
      - zhizhi_mysql_data:/var/lib/mysql
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
      ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      zhizhi:
        ipv4_address: 172.28.0.10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: zhizhi-redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-root}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-root}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      zhizhi:
        ipv4_address: 172.28.0.11
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: docker.m.daocloud.io/library/node:22-alpine
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
    image: zhizhi-ai-agent:latest
    container_name: zhizhi-app
    restart: unless-stopped
    # docker cp 后脚本可能丢失可执行位；用 bash 启动不依赖 +x
    entrypoint: ["bash", "/app/docker/entrypoint.sh"]
    env_file:
      - .env
    environment:
      # 覆盖镜像里旧版 seed_users.py：python scripts/*.py 时 sys.path 默认是 scripts/，找不到 app
      PYTHONPATH: /app
      MYSQL_ENABLED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MCP_IMAGE_SEARCH_URL: http://127.0.0.1:8765/search
      ARTIFACTS_DIR: /app/data/artifacts
      REGISTER_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mysql:172.28.0.10"
      - "redis:172.28.0.11"
    ports:
      - "8124:8124"
    volumes:
      - zhizhi_artifacts:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      zhizhi:
        ipv4_address: 172.28.0.12
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

networks:
  zhizhi:
    name: zhizhi_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  zhizhi_mysql_data:
  zhizhi_artifacts:
