  <circle cx="70" cy="63" r="4.2" fill="#2F7A6B"/>
  <path d="M62.5 75.5c1.8-4.2 4.6-6.2 7.5-6.2s5.7 2 7.5 6.2" stroke="#2F7A6B" stroke-width="2.4" stroke-linecap="round"/>
</svg>
