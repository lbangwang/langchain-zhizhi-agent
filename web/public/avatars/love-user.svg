<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <linearGradient id="loveUserBg" x1="12" y1="8" x2="88" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8F4F1"/>
      <stop offset="1" stop-color="#D3EBE4"/>
    </linearGradient>
    <linearGradient id="loveUserAccent" x1="28" y1="22" x2="72" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F7A6B"/>
      <stop offset="1" stop-color="#1F5C50"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="28" fill="url(#loveUserBg)"/>
  <!-- head -->
  <circle cx="48" cy="34" r="15" fill="url(#loveUserAccent)"/>
  <!-- shoulders -->
  <path d="M22 78c4.2-13.5 13.5-21 26-21s21.8 7.5 26 21" stroke="url(#loveUserAccent)" stroke-width="10" stroke-linecap="round"/>
