# Local infra for Python portfolio (W1+)
# 启动：docker compose up -d
# 说明：本机若已有 MySQL/Redis，可只起缺失的服务，或改用本机进程。
# Milvus full stack：官方 standalone compose，或 MILVUS_HOST 指向云服务器。

services:
  mysql:
    image: mysql:8.0
    container_name: zhizhi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: zhizhi_ai_agent
    ports:
      - "3306:3306"
    volumes:
      - zhizhi_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: zhizhi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # 与 .env.example 默认 REDIS_PASSWORD=root 对齐
    command: ["redis-server", "--requirepass", "root"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "root", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zhizhi_mysql_data:
